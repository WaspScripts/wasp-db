name: Sync schema snapshot

on:
  schedule:
    - cron: "0 3 * * *" # every 24h at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dump-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump schema
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          supabase db dump \
            --db-url "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/postgres" \
            --schema public,profiles,scripts,stats,stripe,info \
            -f supabase/schema.sql

      - name: Check for secrets before committing
        run: |
          if grep -inE "secret|api_key|password|token|key_id" supabase/schema.sql \
            | grep -ivE "secret_key\"|decrypted_secrets|WEBHOOK_SECRET|generate_hmac|path_tokens"; then
            echo "::error::Potential secret found in schema dump — aborting commit."
            exit 1
          fi

      - name: Commit changes if schema differs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- supabase/schema.sql; then
            echo "No schema changes detected."
          else
            git add supabase/schema.sql
            git commit -m "Sync schema snapshot [automated]"
            git push
          fi
